<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#262626" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f7f6f3"/>

  <image href="logo.svg" x="96" y="130" width="72" height="72"/>
  <text x="96" y="290" fill="#262626" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-3">Print Goals</text>
  <text x="96" y="348" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" letter-spacing="-0.5">Keep your goals in sight</text>
  <line x1="96" y1="398" x2="610" y2="398" stroke="#262626" stroke-width="2"/>
  <text x="96" y="438" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">PLAN. PRINT. PROGRESS.</text>

  <g filter="url(#shadow)">
    <rect x="747" y="70" width="386" height="500" fill="#ffffff" stroke="#262626" stroke-width="3"/>
    <image href="example.png" x="755" y="78" width="370" height="484" preserveAspectRatio="xMidYMid meet"/>
  </g>
